<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIO for Dummies</title>
<meta name="description" content="Learn the RP2040's Programmable I/O (PIO) from zero: from logic gates and flip-flops to state machines, a 3D tour of the PIO block, the nine instructions, and a PIO simulator with missions - then run your programs in MicroPython.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same look as "RP2040 Peripherals for Dummies": a bench instrument. */
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --surface2:#F4F7F8; --ink:#13202A; --muted:#5A6874; --line:#D2DAE0;
  --accent:#08876F; --accent-ink:#FFFFFF; --copper:#B97A12; --danger:#C2362B; --ok:#1F8A4C;
  --sig1:#08876F; --sig2:#2F62D6; --sig3:#C2410C; --sig4:#7C4DDB; --grid:rgba(19,32,42,.06);
  --led-off:#C9D2D8; --led-on:#E23B2E; --code-bg:#F4F7F8; --hl:rgba(185,122,18,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1116; --surface:#111A21; --surface2:#16212A; --ink:#E2EAF0; --muted:#8C9AA6; --line:#243240;
  --accent:#2CD1B1; --accent-ink:#04201A; --copper:#E9B44C; --danger:#F06A5E; --ok:#4CD38A;
  --sig1:#2CD1B1; --sig2:#6E9BFF; --sig3:#FF8A4C; --sig4:#B79BFF; --grid:rgba(226,234,240,.06);
  --led-off:#2A3743; --led-on:#FF5A4C; --code-bg:#0D151B; --hl:rgba(233,180,76,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1116; --surface:#111A21; --surface2:#16212A; --ink:#E2EAF0; --muted:#8C9AA6; --line:#243240;
  --accent:#2CD1B1; --accent-ink:#04201A; --copper:#E9B44C; --danger:#F06A5E; --ok:#4CD38A;
  --sig1:#2CD1B1; --sig2:#6E9BFF; --sig3:#FF8A4C; --sig4:#B79BFF; --grid:rgba(226,234,240,.06);
  --led-off:#2A3743; --led-on:#FF5A4C; --code-bg:#0D151B; --hl:rgba(233,180,76,.18); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
code,.mono{font-family:var(--f-mono);font-size:.92em}
code{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 .3em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:.55em 0}

/* ---------------- header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;text-decoration:none;color:var(--ink)}
.brand .chip{width:30px;height:30px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font:700 11px var(--f-mono);position:relative}
.brand .chip::before,.brand .chip::after{content:"";position:absolute;left:-5px;right:-5px;top:7px;bottom:7px;border-left:3px dotted var(--muted);border-right:3px dotted var(--muted)}
.xpbar{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px}
.xpbar .rank{font-weight:700}
.xpbar .meter{width:140px;height:8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.xpbar .meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px}

/* ---------------- layout */
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;margin:22px auto 60px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.rail{position:sticky;top:78px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
@media (max-width:900px){.rail{position:static}}
.rail h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 8px 8px}
.chap{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 9px;line-height:1.25}
.chap:hover{background:var(--surface2)}
.chap.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chap .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-mono);border:2px solid var(--line);background:var(--surface2)}
.chap.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.chap .t{font-weight:700;font-size:14.5px}
.chap .s{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,30px);min-width:0}
.kicker{font:700 12.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--copper)}
.panel>h2{font-size:clamp(26px,3.4vw,38px);margin:.15em 0 .3em}
.lede{font-size:18px;color:var(--muted);max-width:760px}
.sec{border-top:1px solid var(--line);margin-top:26px;padding-top:22px}
.sec>h3{font-size:22px;margin-bottom:8px}
.sec>h3 .step{font:700 13px var(--f-mono);color:var(--accent);margin-right:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.note{border-left:4px solid var(--copper);background:var(--surface2);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0}
.note.ok{border-color:var(--ok)}
.note.bad{border-color:var(--danger)}
.picture{border-left:4px solid var(--sig2);background:var(--surface2);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0}
.picture b:first-child{color:var(--sig2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--surface2);font-family:var(--f-display)}
table.t tr.hit td{background:var(--hl)}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font:14px/1.55 var(--f-mono);margin:10px 0}
pre.code .c{color:var(--muted)}
pre.code .k{color:var(--sig2);font-weight:600}
.tag{display:inline-block;font:700 12px var(--f-mono);border-radius:6px;padding:1px 7px;background:var(--surface2);border:1px solid var(--line)}

/* ---------------- 3D stages */
.stage3d{position:relative;height:420px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1b2b38,#070c11 75%);border:1px solid var(--line);touch-action:none;cursor:grab}
.stage3d canvas{display:block;width:100%;height:100%}
.stage3d .hud{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:#E2EAF0;font-size:13px}
.stage3d .hud .pill{background:rgba(7,12,17,.72);border:1px solid #2b3c4b;border-radius:20px;padding:3px 10px;pointer-events:auto}
.stage3d .tip{position:absolute;left:10px;bottom:10px;max-width:min(430px,calc(100% - 20px));background:rgba(7,12,17,.86);color:#E2EAF0;border:1px solid #2b3c4b;border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.45}
.stage3d .tip b{color:#2CD1B1}
.stage3d .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8de;padding:20px;text-align:center}

/* ---------------- small widgets */
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 12px;font-weight:700}
.sw .bit{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 14px var(--f-mono);background:var(--surface2);border:1px solid var(--line)}
.sw.on .bit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.led{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--led-off);border:2px solid var(--line);vertical-align:middle;transition:background .08s,box-shadow .08s}
.led.on{background:var(--led-on);box-shadow:0 0 12px var(--led-on)}
.led.g.on{background:#2ecc71;box-shadow:0 0 12px #2ecc71}
.led.y.on{background:#f1c40f;box-shadow:0 0 12px #f1c40f}
svg text{font-family:var(--f-body)}
.wave{width:100%;height:auto;display:block}
.quiz .q{margin:14px 0 6px;font-weight:700}
.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;margin:6px 0}
.quiz .opt:hover{border-color:var(--accent)}
.quiz .opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.quiz .opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.quiz .why{font-size:14.5px;color:var(--muted);margin:4px 0 0 4px}

/* instruction cards */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.icard{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px 14px}
.icard h4{font:800 20px var(--f-mono);color:var(--accent);margin-bottom:2px}
.icard .does{font-weight:700}
.icard pre{margin:6px 0;font:13px/1.5 var(--f-mono);white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* ---------------- the simulator */
.sim{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:14px}
@media (max-width:980px){.sim{grid-template-columns:1fr}}
.editor{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);display:flex;overflow:hidden;height:340px}
.editor .gut{flex:none;width:40px;padding:10px 0;text-align:right;color:var(--muted);font:14px/22px var(--f-mono);user-select:none;overflow:hidden}
.editor .gut div{padding-right:8px;height:22px}
.editor .gut div.err{color:#fff;background:var(--danger)}
.editor .area{position:relative;flex:1;min-width:0}
.editor textarea{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;background:transparent;color:var(--ink);font:14px/22px var(--f-mono);padding:10px 10px;white-space:pre;overflow:auto;outline:none;tab-size:4}
.editor .pcline{position:absolute;left:0;right:0;height:22px;background:var(--hl);border-left:3px solid var(--copper);pointer-events:none;display:none}
.errs{font-size:14px;color:var(--danger);min-height:20px;margin:6px 0}
.machine{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px}
.regs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.reg{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 8px;min-width:0}
.reg .l{font:700 11.5px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.reg .v{font:600 15px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg.wide{grid-column:span 2}
.bits32{font:600 12px var(--f-mono);letter-spacing:.5px;word-break:break-all}
.bits32 .used{color:var(--muted);opacity:.45}
.fifo{display:flex;gap:4px;align-items:center;margin-top:3px}
.fifo span{width:46px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font:600 11px/22px var(--f-mono);text-align:center;overflow:hidden}
.fifo span.full{background:color-mix(in srgb,var(--sig2) 22%,var(--surface));border-color:var(--sig2)}
.status{font-size:14px;margin:8px 0 2px;min-height:22px}
.status.stall{color:var(--copper);font-weight:700}
.pinsrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.pin{display:flex;flex-direction:column;align-items:center;font:600 11.5px var(--f-mono);color:var(--muted);gap:3px}
.pushbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font:700 11px var(--f-mono);touch-action:none}
.pushbtn.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.ctrl label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
canvas.scope{width:100%;height:150px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mbrief{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.mlist button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:14px}
.mlist button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.stars{color:var(--copper);letter-spacing:2px}
.result{margin-top:10px}
.tabs2{display:flex;gap:6px;margin:6px 0}
.tabs2 button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:13.5px}
.tabs2 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* certificate */
.cert{border:6px double var(--copper);border-radius:14px;padding:30px;text-align:center;background:var(--surface)}
.cert h2{font-size:34px}
@media print{.top,.rail,.navrow,.noprint{display:none!important}.layout{display:block}.panel{border:0}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#" onclick="App.go(0);return false"><span class="chip">PIO</span>PIO for Dummies</a>
    <div class="xpbar" aria-live="polite">
      <span class="rank" id="rank">Beginner</span>
      <span class="meter" title="Your XP"><i id="xpfill"></i></span>
      <span class="mono" id="xp">0 XP</span>
      <button class="iconbtn" id="themeBtn" title="Light / dark">◐</button>
    </div>
  </div>
</header>
<div class="wrap layout">
  <nav class="rail" aria-label="Chapters">
    <h3>Your journey</h3>
    <div id="chapters"></div>
  </nav>
  <main class="panel" id="main" tabindex="-1"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="pio-sim.js"></script>
<script src="scenes3d.js"></script>
<script src="app.js"></script>
</body>
</html>
