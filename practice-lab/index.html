const SCORE_URL=(window.LAB_CONFIG&&window.LAB_CONFIG.scoreUrl)||"";
const STORE="rp2040-lab-v2";
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){}}
let saved=load(); saved.best=saved.best||{}; saved.read=saved.read||{};
try{const old=JSON.parse(localStorage.getItem("rp2040-lab-v1")||"{}");if(!saved.name&&old.name)saved.name=old.name;if(!saved.roll&&old.roll)saved.roll=old.roll;if(old.pending&&!saved.pending)saved.pending=old.pending}catch(e){}
let S={screen:"home"};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const go=f=>{f();window.scrollTo(0,0)};
const modIndex=id=>MODULES.findIndex(m=>m.id===id);
function isDone(m){const b=saved.best[m.id];return !!b}
function suggested(){const i=MODULES.findIndex(m=>!isDone(m));return i}

/* ---------------- home ---------------- */
function home(){
  S={screen:"home"};
  const done=MODULES.filter(isDone).length, sug=suggested();
  const groups=[["Unit 1",["M1","M2"]],["Unit 2",["M3","M4"]],["Unit 3",["M5"]],["Interrupts, DMA and PIO",["M6","M7","M8"]]];
  const modCard=id=>{const i=modIndex(id),m=MODULES[i],b=saved.best[m.id];
    let mini="";for(let k=0;k<m.q.length;k++)mini+=`<i class="${b&&k<b.first?"on":""}"></i>`;
    const status=b?`Best: ${b.first} of ${m.q.length} right first time`:(saved.read[m.id]?"Lesson read · practice not done yet":"Not started");
    return `<div class="card mod${b?" done":""}"><span class="num">${b?"✓":m.id}</span>
      <div class="meta"><span class="label">${esc(m.tag)} · ${m.lesson.length} lesson cards · ${m.q.length} questions</span>
      <h3>${esc(m.title)}${i===sug?'<span class="badge">Do this next</span>':""}</h3><span class="muted">${esc(m.blurb)}</span>
      <span class="muted" style="font-size:.9rem">${status}</span><div class="mini">${mini}</div></div>
      <div class="btns"><button class="${b?"ghost":"primary"}" data-learn="${i}">${saved.read[m.id]?"Read again":"1. Learn"}</button><button class="${b?"primary":"ghost"}" data-play="${i}">${b?"Practise again":"2. Practise"}</button></div></div>`};
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:6px">
    <span class="label">U21BM501 · Microcontroller and its Applications</span>
    <h1>RP2040 Practice Lab</h1>
    <p class="muted">Learn one topic at a time. First read the short lesson cards, then practise. Every right answer lights a pin. A question you get wrong comes back until you know it.</p>
  </header>
  <div class="card"><div class="who"><div class="fld"><label for="nm" class="label">Your name</label><input type="text" id="nm" placeholder="e.g. Priya S" value="${esc(saved.name||"")}" autocomplete="off" maxlength="60"></div>
  <div class="fld"><label for="rl" class="label">Roll number</label><input type="text" id="rl" placeholder="e.g. 23BM045" value="${esc(saved.roll||"")}" autocomplete="off" maxlength="20"></div></div>
  <p class="err" id="err" hidden>Type your name and roll number first, so your teacher gets your score.</p>
  <div class="overall"><span class="label">${done} of ${MODULES.length} topics done</span><div class="bar"><span style="width:${done/MODULES.length*100}%"></span></div></div></div>
  ${pendingNote()}
  ${groups.map(([g,ids])=>`<section class="group"><span class="label">${g}</span><div class="mods">${ids.map(modCard).join("")}</div></section>`).join("")}
  <section class="group"><span class="label">Revise everything</span>
   <div class="card mod"><span class="num">Mix</span><div class="meta"><h3>Mixed revision</h3><span class="muted">20 random questions from all 8 topics. Good practice before a test.</span></div>
   <div class="btns"><button class="primary" id="mix">Start</button></div></div>
   <div class="card mod"><span class="num">A–Z</span><div class="meta"><h3>Glossary</h3><span class="muted">${GLOSSARY.length} words and short forms explained in plain English.</span></div>
   <div class="btns"><button class="ghost" id="glo">Open</button></div></div>
  </section>`;
  const nm=document.getElementById("nm"),rl=document.getElementById("rl");
  nm.addEventListener("input",()=>{saved.name=nm.value.trim();save()});
  rl.addEventListener("input",()=>{saved.roll=rl.value.trim().toUpperCase();save()});
  const ready=()=>{if(saved.name&&saved.roll)return true;const e=document.getElementById("err");e.hidden=false;(saved.name?rl:nm).focus();e.scrollIntoView({block:"center"});return false};
  app.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{if(ready())go(()=>start(+b.dataset.play))});
  app.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>{if(ready())go(()=>lesson(+b.dataset.learn,0))});
  document.getElementById("mix").onclick=()=>{if(ready())go(startMix)};
  document.getElementById("glo").onclick=()=>go(()=>glossary(""));
  flushPending();
}

/* ---------------- lesson ---------------- */
function lessonCard(c){
  let h="";
  if(c.p)h+=`<p>${c.p}</p>`;
  if(c.svg)h+=`<div class="dia">${SVG[c.svg]}</div>`;
  if(c.table)h+=`<div class="tbl"><table><thead><tr>${c.table.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${c.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(c.flow)h+=`<ol class="flow">${c.flow.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  if(c.p2)h+=`<p>${c.p2}</p>`;
  if(c.code)h+=`<pre><code>${esc(c.code)}</code></pre>`;
  if(c.analogy)h+=`<div class="analogy"><span class="label">Think of it like this</span><p>${esc(c.analogy)}</p></div>`;
  if(c.key)h+=`<div class="key"><span class="label">Remember</span><p>${esc(c.key)}</p></div>`;
  return h;
}
function lesson(mi,step){
  const m=MODULES[mi],n=m.lesson.length,c=m.lesson[step];
  S={screen:"lesson",mi,step};
  const last=step===n-1;
  app.innerHTML=`<div class="top-nav"><button class="ghost" id="back">← All topics</button><span class="label">${esc(m.tag)} · ${esc(m.title)}</span></div>
  <div class="card pop">
    <div class="row"><span class="label">Lesson card ${step+1} of ${n}</span><span class="spacer"></span><div class="dots">${m.lesson.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div></div>
    <h2>${esc(c.h)}</h2>
    <div class="lesson-body">${lessonCard(c)}</div>
    <div class="row">${step>0?`<button class="ghost" id="prev">← Back</button>`:""}<span class="spacer"></span>
    ${last?`<button class="primary" id="next">Start practice →</button>`:`<button class="primary" id="next">Next card →</button>`}</div>
  </div>
  ${last?"":`<p class="muted" style="text-align:center"><button class="link" id="skip">I know this already, go to practice</button></p>`}`;
  document.getElementById("back").onclick=()=>go(home);
  const p=document.getElementById("prev");if(p)p.onclick=()=>go(()=>lesson(mi,step-1));
  document.getElementById("next").onclick=()=>{if(last){saved.read[m.id]=true;save();go(()=>start(mi))}else go(()=>lesson(mi,step+1))};
  const sk=document.getElementById("skip");if(sk)sk.onclick=()=>go(()=>start(mi));
}

/* ---------------- glossary ---------------- */
function glossary(qs){
  S={screen:"glossary"};
  app.innerHTML=`<div class="top-nav"><button class="ghost" id="back">← All topics</button><span class="label">Glossary</span></div>
  <div class="card"><h2>Glossary</h2><label for="gs" class="label">Search a word</label><input type="search" id="gs" placeholder="e.g. DREQ, spinlock, NVIC" value="${esc(qs)}" autocomplete="off"><ul class="gl" id="gl"></ul></div>`;
  const draw=()=>{const v=document.getElementById("gs").value.trim().toLowerCase();
    const rows=GLOSSARY.filter(g=>!v||g[0].toLowerCase().includes(v)||g[1].toLowerCase().includes(v));
    document.getElementById("gl").innerHTML=rows.length?rows.map(g=>{const mi=modIndex(g[2]);return `<li><span class="t">${esc(g[0])}</span><span>${esc(g[1])} <button class="link" data-l="${mi}">${esc(MODULES[mi].title)}</button></span></li>`}).join(""):`<li><span></span><span class="muted">No word matches "${esc(v)}". Try a shorter word.</span></li>`;
    document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>go(()=>lesson(+b.dataset.l,0)));};
  document.getElementById("gs").addEventListener("input",draw);draw();
  document.getElementById("back").onclick=()=>go(home);
}

/* ---------------- practice ---------------- */
function boardHTML(title,n,mastered,cur){
  let pins="";for(let i=0;i<n;i++)pins+=`<span class="pin${mastered.has(i)?" on":""}${cur===i?" now":""}"></span>`;
  return `<div class="board"><div class="board-top"><span class="chipname">RP2040 · ${esc(title).toUpperCase()}</span><span class="label">${mastered.size} of ${n} pins lit</span></div><div class="pins" aria-label="${mastered.size} of ${n} questions learnt">${pins}</div></div>`;
}
function startSet(set){
  S={screen:"play",set,queue:shuffle(set.q.map((_,i)=>i)),mastered:[],firstTry:[],tried:[],usedHint:[],hints:0,mistakes:0,t0:Date.now(),answered:false,opts:null};
  ask();
}
function start(mi){const m=MODULES[mi];startSet({id:m.id,mi,title:m.title,tag:m.tag,q:m.q})}
function startMix(){
  const all=[];MODULES.forEach((m,mi)=>m.q.forEach(q=>all.push([...q,mi])));
  startSet({id:"MIX",mi:-1,title:"Mixed revision",tag:"All topics",q:shuffle(all).slice(0,20)});
}
function ask(){
  const q=S.set.q[S.queue[0]];
  if(!S.opts)S.opts=shuffle(q[1].map((t,i)=>({t,ok:i===0})));
  S.answered=false;S.hintShown=false;S.pick=null;S.again=S.tried.includes(S.queue[0]);
  render();
}
function render(){
  const set=S.set,qi=S.queue[0],q=set.q[qi],m=new Set(S.mastered);
  const opts=S.opts.map((o,i)=>{let cls="opt";if(S.answered){if(o.ok)cls+=" right";else if(S.pick===i)cls+=" wrong";else cls+=" dim"}
    return `<button class="${cls}" data-o="${i}" ${S.answered?"disabled":""}><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`}).join("");
  const srcMi=q[4]!==undefined?q[4]:set.mi;
  let fb="";
  if(S.answered){const ok=S.opts[S.pick].ok;
    fb=`<div class="feedback ${ok?"ok":"no"} pop" role="status"><strong>${ok?"Correct!":"Not this time. The answer is: "+esc(S.opts.find(o=>o.ok).t)}</strong><span>${esc(q[3])}</span>${ok?"":`<span class="muted">This question will come back in a few turns.</span>`}</div>
    <div class="row">${ok?"":`<button class="ghost" id="relearn">Read the ${esc(MODULES[srcMi].title)} lesson</button>`}<span class="spacer"></span><button class="primary" id="next">${S.queue.length===1&&ok?"See my result":"Next question →"}</button></div>`}
  app.innerHTML=`<div class="top-nav"><button class="ghost" id="back">← All topics</button><span class="label">${esc(set.tag)} · ${esc(set.title)}</span></div>
  ${boardHTML(set.title,set.q.length,m,qi)}
  <div class="card pop">
    <span class="label">${S.again?"Try this one again":"Question"}${set.id==="MIX"?" · "+esc(MODULES[srcMi].title):""} · ${S.queue.length} left to light</span>
    <p class="q">${esc(q[0])}</p>
    <div class="opts">${opts}</div>
    ${!S.answered?(S.hintShown?`<div class="hint"><span class="label">Hint</span><p>${esc(q[2])}</p></div>`:`<div class="row"><button class="ghost" id="hint">Show a hint</button></div>`):""}
    ${fb}
  </div>`;
  document.getElementById("back").onclick=()=>go(home);
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  const h=document.getElementById("hint");if(h)h.onclick=()=>{S.hintShown=true;S.hints++;S.usedHint.push(qi);render()};
  const rl=document.getElementById("relearn");if(rl)rl.onclick=()=>relearn(srcMi);
  const n=document.getElementById("next");if(n){n.onclick=next;n.focus({preventScroll:true})}
}
/* open the lesson mid-practice and come back to the same place */
function relearn(mi){
  const keep=S;
  const m=MODULES[mi];let step=0;
  const show=()=>{const c=m.lesson[step];
    app.innerHTML=`<div class="top-nav"><button class="primary" id="ret">← Back to my questions</button><span class="label">${esc(m.title)} · card ${step+1} of ${m.lesson.length}</span></div>
    <div class="card pop"><h2>${esc(c.h)}</h2><div class="lesson-body">${lessonCard(c)}</div>
    <div class="row">${step>0?`<button class="ghost" id="prev">← Back</button>`:""}<span class="spacer"></span>${step<m.lesson.length-1?`<button class="ghost" id="nx">Next card →</button>`:""}</div></div>`;
    document.getElementById("ret").onclick=()=>{S=keep;go(render)};
    const p=document.getElementById("prev");if(p)p.onclick=()=>{step--;go(show)};
    const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{step++;go(show)};};
  S={screen:"relearn"};go(show);
}
function choose(i){
  if(S.answered)return;
  const qi=S.queue[0];S.pick=i;S.answered=true;
  if(S.opts[i].ok){if(!S.tried.includes(qi)&&!S.usedHint.includes(qi))S.firstTry.push(qi);S.mastered.push(qi)}
  else{S.mistakes++;if(!S.tried.includes(qi))S.tried.push(qi)}
  render();
}
function next(){
  const qi=S.queue.shift();const ok=S.opts[S.pick].ok;S.opts=null;
  if(!ok){S.queue.splice(Math.min(3,S.queue.length),0,qi)}
  if(!S.queue.length)return go(finish);
  ask();window.scrollTo(0,0);
}

/* ---------------- result + sending ---------------- */
function pendingNote(){const p=(saved.pending||[]).length;
  return SCORE_URL&&p?`<div class="card"><p class="send">${p} score${p>1?"s are":" is"} waiting to be sent. They will go to your teacher automatically when you are online.</p></div>`:""}
let sending=false;
async function flushPending(show){
  if(!SCORE_URL||sending||!(saved.pending||[]).length)return;
  sending=true;const el=()=>document.getElementById("send");
  while((saved.pending||[]).length){
    try{await fetch(SCORE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(saved.pending[0])});
      saved.pending.shift();save();
      if(show&&el()){el().textContent="Your score has been sent to your teacher.";el().className="send ok"}}
    catch(e){if(show&&el()){el().innerHTML='Could not send your score (no internet?). It is saved on this device. <button class="ghost" id="retry">Try again</button>';el().className="send bad";
        const r=document.getElementById("retry");if(r)r.onclick=()=>{el().textContent="Sending…";el().className="send";flushPending(true)}}
      break}
  }
  sending=false;
}
function finish(){
  const set=S.set,n=set.q.length,first=S.firstTry.length,hints=S.hints,mist=S.mistakes;
  const stars=first>=n*0.85?3:first>=n*0.6?2:1;
  const record={name:saved.name||"",roll:saved.roll||"",unit:set.id+" "+set.title,first,total:n,hints,mistakes:mist,stars,
    minutes:Math.round((Date.now()-S.t0)/6000)/10,missed:S.tried.map(i=>set.q[i][0]).join(" | ")};
  if(set.id!=="MIX"){const prev=saved.best[set.id];if(!prev||first>prev.first)saved.best[set.id]={first,date:new Date().toISOString().slice(0,10)}}
  save();
  const who=(saved.name||"(name not entered)")+(saved.roll?" · "+saved.roll:"");
  const d=new Date(),ds=d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+", "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  const msg=stars===3?"Excellent. You know this topic well.":stars===2?"Good work. Read the lesson once more and play again to light more pins first time.":"Well done for finishing. Read the lesson cards again and play once more; it gets easier every time.";
  const sug=suggested(),mi=set.mi;
  const nextBtn=set.id!=="MIX"&&sug>=0&&sug!==mi?`<button class="primary" id="nextm">Next: ${esc(MODULES[sug].title)}</button>`:"";
  S={screen:"done",set};
  app.innerHTML=`${boardHTML(set.title,n,new Set(set.q.map((_,i)=>i)),-1)}
  <div class="card pop">
    <span class="label">All ${n} pins lit</span><h2>${esc(set.title)} complete</h2>
    <div class="stars" aria-label="${stars} of 3 stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
    <p>${msg}</p>
    <div class="stats"><div class="stat"><span class="label">Right first time</span><b>${first}/${n}</b></div>
      <div class="stat"><span class="label">Hints used</span><b>${hints}</b></div><div class="stat"><span class="label">Mistakes fixed</span><b>${mist}</b></div></div>
    <div class="cert"><span class="label">Show this to your teacher</span><b>${esc(who)}</b><span>${esc(set.title)} · ${first}/${n} right first time · ${stars} star${stars>1?"s":""}</span><span class="muted">${ds}</span></div>
    <p class="send" id="send" ${SCORE_URL?"":"hidden"}>Sending your score to your teacher…</p>
    <div class="row"><button class="ghost" id="home">All topics</button>${mi>=0&&stars<3?`<button class="ghost" id="rel">Read the lesson again</button>`:""}<button class="ghost" id="again">Play again</button><span class="spacer"></span>${nextBtn}</div>
  </div>`;
  document.getElementById("home").onclick=()=>go(home);
  document.getElementById("again").onclick=()=>go(()=>set.id==="MIX"?startMix():start(mi));
  const r=document.getElementById("rel");if(r)r.onclick=()=>go(()=>lesson(mi,0));
  const nm=document.getElementById("nextm");if(nm)nm.onclick=()=>go(()=>lesson(sug,0));
  if(SCORE_URL){saved.pending=(saved.pending||[]).concat([record]);save();flushPending(true)}
}
document.addEventListener("keydown",e=>{
  if(S.screen!=="play"||e.target.tagName==="INPUT")return;
  if(!S.answered&&/^[1-9]$/.test(e.key)&&+e.key<=S.opts.length)choose(+e.key-1);
});
home();
</script>

</body>
</html>
